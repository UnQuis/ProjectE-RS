name: One-shot Rust formatting

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ProjectE-RS
        uses: actions/checkout@v4
        with:
          path: projecte-rs

      - name: Check out the pinned Horizon revision
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca
          path: horizon

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Prepare the pinned Horizon dependency
        working-directory: projecte-rs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("engine/Cargo.toml")
          content = manifest.read_text()
          local_path = 'path = "/home/alexquasar/.local/share/horizon-launcher/native/source/fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca/crates/horizon-client"'
          ci_path = 'path = "../../horizon/crates/horizon-client"'
          if content.count(local_path) != 1:
              raise SystemExit("Expected exactly one pinned local horizon-client path")
          manifest.write_text(content.replace(local_path, ci_path))
          PY

      - name: Apply rustfmt and commit the result
        working-directory: projecte-rs
        run: |
          cargo fmt --all
          if git diff --quiet -- engine/src; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src
          git commit -m "style: format all Rust sources"
          git push origin HEAD:master
