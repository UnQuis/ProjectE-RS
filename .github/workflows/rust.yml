name: Native mod CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mod-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mod:
    name: Validate and compile ProjectE-RS only
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out ProjectE-RS
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate metadata, resources, gameplay tables and Python tests
        run: python3 tools/gate.py --python-only

      - name: Resolve the pinned mod API and refresh Cargo.lock
        run: cargo generate-lockfile --manifest-path engine/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Run Clippy on the mod crate
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Compile the mod crate
        run: cargo check --manifest-path engine/Cargo.toml --all-targets

      - name: Run mod tests
        run: cargo test --manifest-path engine/Cargo.toml --all-targets
