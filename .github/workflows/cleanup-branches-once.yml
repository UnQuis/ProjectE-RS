name: One-shot branch cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Delete superseded branches
        run: |
          git push origin --delete \
            arena/043ffc39-projecte-rs \
            assistant/automation-architecture \
            assistant/condenser-accounting-core \
            assistant/energy-system-port \
            assistant/github-actions-ci \
            assistant/machine-domain-module \
            assistant/mod-validation-tools \
            assistant/power-flower-condenser-mk1 \
            assistant/transmutation-core
